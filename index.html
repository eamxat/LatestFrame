<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* El contenedor maestro es 'fixed' para cubrir toda la pantalla independientemente de dónde esté incrustado */
    .master-ui-container {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2147483647 !important; /* El valor máximo permitido por el navegador */
        pointer-events: none; /* Todo es invisible al clic por defecto */
    }
    .interactuable { pointer-events: auto !important; }
  </style>
</head>
<body class="bg-transparent m-0 p-0">

  <div class="master-ui-container">
    <!-- CABECERA DE CONTROL -->
    <div class="absolute top-[62px] left-6 flex items-center gap-4 interactuable">
        
        <!-- BOTÓN OPCIONES CON MENÚ FIXEADO -->
        <div class="relative">
            <button onclick="window.toggleMenu('menu-opciones', this)" class="px-4 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs font-bold text-white shadow-xl">
                Opciones ▾
            </button>
            
            <!-- MENÚ DESPLEGABLE (Es fijo, no está dentro de la cabecera) -->
            <div id="menu-opciones" class="fixed hidden bg-slate-900 border border-slate-700 rounded-lg shadow-2xl w-48 mt-2 overflow-y-auto max-h-[300px] z-[2147483647]">
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-slate-800">Opción 1</button>
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-slate-800">Opción 2</button>
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-slate-800">Opción 3</button>
            </div>
        </div>

        <!-- BOTÓN PRUEBAS -->
        <div class="relative">
            <button onclick="window.toggleMenu('menu-pruebas', this)" class="px-4 py-1.5 bg-purple-900/80 border border-purple-500 rounded-lg text-xs font-bold text-purple-200 shadow-xl">
                Pruebas ▾
            </button>
            
            <div id="menu-pruebas" class="fixed hidden bg-slate-900 border border-slate-700 rounded-lg shadow-2xl w-48 mt-2 overflow-y-auto max-h-[300px] z-[2147483647]">
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-purple-900/50">Prueba 1</button>
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-purple-900/50">Prueba 2</button>
                <button class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-purple-900/50">Prueba 3</button>
            </div>
        </div>
    </div>
  </div>

  <script>
    window.toggleMenu = function(menuId, btn) {
        const menu = document.getElementById(menuId);
        const rect = btn.getBoundingClientRect();
        
        // Posicionamiento calculado contra el viewport (pantalla)
        menu.style.top = (rect.bottom + 5) + 'px';
        menu.style.left = rect.left + 'px';
        
        // Toggle visual
        const isHidden = menu.classList.contains('hidden');
        
        // Cerrar otros
        document.querySelectorAll('.fixed.flex').forEach(m => {
            m.classList.add('hidden');
            m.classList.remove('flex');
        });
        
        if (isHidden) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
        } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        }
    };

    // Cerrar si das clic fuera
    document.addEventListener('click', (e) => {
        if (!e.target.closest('button')) {
            document.querySelectorAll('.fixed').forEach(m => {
                m.classList.add('hidden');
                m.classList.remove('flex');
            });
        }
    });
  </script>
</body>
</html>
